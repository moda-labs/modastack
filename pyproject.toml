[project]
name = "bobi"
version = "0.58.0"
description = "Build teams of event-driven AI agents"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Moda Labs", email = "zach@modalabs.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "truststore>=0.9",
    # 1.9.1 re-reads self.sock after closing it in WebSocketApp.close(), which
    # races the run_forever() reader thread nulling it out in teardown() and
    # raises AttributeError on close_frame. Skip that one release; see #1079.
    "websocket-client>=1.7,!=1.9.1",
    "certifi>=2024.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "claude-agent-sdk>=0.2.87",
    # <2 is deliberate: nothing else caps mcp since claude-agent-sdk lifted
    # its own bound, and bobi has no lockfile. Lift it only as a deliberate
    # 2.0 migration (mcp_handshake + setup/mcp_probe carry the known renames).
    "mcp>=1.23.0,<2",
    "apsw>=3.40",
    # OTLP wire types for `bobi agent <name> otel`. A core dependency, not an
    # extra: no CI job installs extras, so the collector suite would skip to
    # green. The >=1.44 floor also matters - opentelemetry-proto pinned
    # `protobuf<7` through 1.42.x, so an older release lets pip satisfy
    # `[kb]`'s onnxruntime by DOWNGRADING protobuf onto a different ABI.
    "opentelemetry-proto>=1.44,<2",
]

[project.urls]
Homepage = "https://github.com/moda-labs/bobi-agent"
Repository = "https://github.com/moda-labs/bobi-agent"
Issues = "https://github.com/moda-labs/bobi-agent/issues"

[project.optional-dependencies]
kb = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-playwright>=0.5",
    # Pinned to match the Playwright container image used by the e2e CI job
    # (mcr.microsoft.com/playwright/python:v1.60.0-*). Bump both together so
    # the baked-in browser binary always matches the installed client.
    "playwright==1.60.0",
    "pytest-rerunfailures>=14.0",
    "build",
    "hatchling",
]

[project.scripts]
bobi = "bobi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bobi"]

# The build hook force-includes each declared event-server input file beside
# the immutable generated artifact. Avoid directory force-includes because
# Hatch recurses through ignored npm install state inside forced directories.
[tool.hatch.build.targets.wheel.force-include]
# Author skill guides once at repo-root skills/. Wheels receive those
# exact files under bobi/skills/ so `bobi skill ...` works without a checkout.
"skills" = "bobi/skills"
# Agent teams are NOT bundled into the wheel — they are versioned packages
# fetched from the registry (`name@version`, #440/#446/#451). Baking a frozen
# copy into the framework wheel would pin a team to the framework release and
# defeat independent team versioning. `bobi setup` lists teams from the
# registry (and, in a source checkout, the repo's `agents/` dir for dev).
# The container recipe (Dockerfile, docker/) lives in this repo and is
# published as the reference image; the fleet deploy engine and its scripts
# ship in a private plugin wheel, not here (#707).

[tool.hatch.build.targets.sdist]
# Agent teams are deliberately NOT shipped in the distribution (wheel or sdist) —
# they're fetched from the registry as versioned packages (see the wheel
# force-include note above).
include = ["bobi", "event-server", "skills", "README.md", "CHANGELOG.md",
           "hatch_build.py"]
# The Cloudflare Worker workspace is deliberately NOT in the sdist. Nothing in
# the Python distribution builds or runs it - the wheel's event-server inputs
# are src/ + core/ only (bobi/events/artifact.py) - and its documented deploy
# path is a git clone plus `wrangler deploy`, never PyPI. Stating it here also
# makes the outcome DETERMINISTIC: without this line the sdist's contents
# depend on whether `npm ci` has run, because Hatch's safe_walk follows the
# node_modules workspace symlink (`bobi-events-worker -> ../worker`) first and
# then prunes the real directory as already-visited. `core` escapes that only
# by sorting ahead of `node_modules`. Pinned by tests/test_sdist_contents.py.
exclude = ["**/node_modules", "**/.npm-cache",
           "event-server/dist", "event-server/core/dist",
           "event-server/core/*.tgz", "event-server/worker",
           "**/__pycache__"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "claude: test requires a real Claude CLI session (deselected in integration-fast)",
    "local_only: test only runs against the local Node.js event server backend",
    "docker: test builds/runs the instance container image (needs a docker daemon; deselected in integration-fast)",
    "live: test hits a live external API (Claude, Slack, ...); gated by credentials/env, not run on PRs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
